name: update

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push gh-pages, create releases
      actions: write # keepalive
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the published repo (gh-pages)
        run: |
          if git fetch -q origin gh-pages:gh-pages; then
            git worktree add -q site-out gh-pages
          else
            git worktree add -q --orphan -b gh-pages site-out
          fi

      - name: Install nfpm
        run: |
          curl -fsSLo "$RUNNER_TEMP/nfpm.tgz" https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          echo "6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750  $RUNNER_TEMP/nfpm.tgz" | sha256sum -c
          sudo tar -xzf "$RUNNER_TEMP/nfpm.tgz" -C /usr/local/bin nfpm

      - name: Import the signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.asc"
          gpg --batch --quiet --import "$RUNNER_TEMP/key.asc"
          echo "SIGNING_KEY_FILE=$RUNNER_TEMP/key.asc" >> "$GITHUB_ENV"

      - run: ./build.sh

      - name: Test the new packages
        if: hashFiles('dist/*/*.deb') != ''
        run: ./test.sh

      - name: Publish
        id: publish
        run: |
          if ls dist/*/*.deb > /dev/null 2>&1; then
            sudo apt-get install -y -qq apt-utils createrepo-c > /dev/null
          fi
          ./publish.sh
          cd site-out
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Publish $(ls ../dist | tr '\n' ' ')"
            git push -q origin gh-pages
            echo changed=true >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo changed=true >> "$GITHUB_OUTPUT" # manual runs always redeploy
          fi

      - name: Create GitHub releases
        run: |
          for d in dist/*/; do
            [ -d "$d" ] || continue
            rel=$(basename "$d") # e.g. 4.7.2-stable-1
            tag=${rel%-*}
            gh release view "$rel" > /dev/null 2>&1 && continue
            case $tag in *-stable) flags=--latest ;; *) flags=--prerelease ;; esac
            gh release create "$rel" $flags --title "Godot $tag" --notes "Godot $tag is now in the apt and dnf repos: \`sudo apt upgrade\` or \`sudo dnf upgrade\`. New here? See the [install instructions](https://github.com/${{ github.repository }}#install).

          Upstream release: https://github.com/godotengine/godot-builds/releases/tag/$tag" "$d"*
          done

      - name: Keep the schedule alive
        # GitHub turns off cron workflows after 60 days without repo activity
        run: gh workflow enable update.yml

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.publish.outputs.changed
        with:
          path: site-out

  deploy:
    needs: update
    if: needs.update.outputs.changed
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
